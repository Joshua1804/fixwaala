name: fixwaala
description: "Fixwaala - AI-assisted hyperlocal home-repair marketplace with trust-gated matching."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (skeleton — add via `flutterfire configure`)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  # firebase_storage: ^12.0.0
  firebase_messaging: ^15.1.0
  google_sign_in: ^6.2.1

  # AI ticket assist (Gemini)
  http: ^1.2.0

  # Maps & location
  # google_maps_flutter: ^2.6.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_local_notifications: ^18.0.1

  # State management & routing
  # provider: ^6.1.2
  # go_router: ^14.2.0

  # Utilities
  image_picker: ^1.1.0

  # Analytics charts
  fl_chart: ^0.69.0

  # Masked-call handoff between matched parties
  url_launcher: ^6.3.0

  # Local persistence for preferences
  shared_preferences: ^2.3.0
  cached_network_image: ^3.4.1
  # camera: ^0.11.0
  # intl: ^0.19.0
  # http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
